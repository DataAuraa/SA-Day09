version: '3.8'

services:
  ai-hr-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_hr_assistant_service
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - LLM_PROVIDER=deterministic_mock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

# Netlify configuration for Day 09 Training Portal
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

# URL Redirects for Clean Navigation
[[redirects]]
  from = "/capstone"
  to = "/capstone_portal.html"
  status = 200

[[redirects]]
  from = "/portal"
  to = "/capstone_portal.html"
  status = 200

[[redirects]]
  from = "/handbook"
  to = "/handbook.html"
  status = 200

